workspace:
  # Your Slack Bot User OAuth Token (starts with xoxb-)
  # Get this from: https://api.slack.com/apps → Your App → Install App
  bot_token: "xoxb-your-bot-token-here"

  # Your Slack App-Level Token for Socket Mode (starts with xapp-)
  # Get this from: https://api.slack.com/apps → Your App → Socket Mode
  socket_token: "xapp-your-socket-token-here"

ui:
  # Theme: default, dark, or light
  theme: "default"

  # Enable vim-style keybindings
  vim_mode: true

  # Show timestamps on messages
  show_timestamps: true
